<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareRide · Caregiver app</title>
<title>CareRide Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* VOICE calm, trustworthy healthcare product walkthrough; a story told one moment at a time
   IDEA a family's week of dialysis rides, seen from the son's phone and the mother's phone
   PICTURE one phone at the centre, switchable between caregiver and rider, beside a "behind the scenes" panel
   COLOUR soft mist ground, deep teal for trust and actions, coral only for problems, white surfaces
   TYPE Manrope throughout
   LAYOUT wide: timeline | phone | behind the scenes; medium: phone + panel, timeline as chips; narrow: stacked */
:root{color-scheme:light;--bg:#eef3f2;--w:#fff;--ink:#12302b;--ink2:#2c4a45;--mute:#5d736f;--line:#dbe5e3;--soft:#f4f8f7;
--teal:#0d7a68;--teal-d:#0a6455;--teal-t:#e3f3ef;--mint:#c9ebe2;--coral:#e0563b;--coral-t:#fdecE7;--amber:#a86500;--amber-t:#fff3df;
--sh:0 1px 2px rgba(18,48,43,.05),0 10px 30px rgba(18,48,43,.07)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:800}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ic{flex:none;display:inline-block;vertical-align:-3px}
.top{padding:24px max(4vw,16px) 8px}
.wrap{max-width:1380px;margin:0 auto}
.tb{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.brand h1{font-size:clamp(24px,3vw,30px)}
.brand p{margin:0;color:var(--mute);font-size:14px}
.tag0{font-size:12px;font-weight:700;color:var(--teal-d);background:var(--teal-t);border-radius:999px;padding:5px 12px;white-space:nowrap}
.intro{margin:14px 0 0;color:var(--ink2);max-width:92ch}
.stage{max-width:1380px;margin:0 auto;padding:18px max(4vw,16px) 36px;display:grid;grid-template-columns:270px 380px minmax(0,1fr);gap:28px;align-items:start}
/* timeline */
.tlw{position:sticky;top:12px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);margin:0 0 10px;letter-spacing:.01em}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl li button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 8px 8px 0;border-radius:12px;align-items:start}
.tl li button:hover{background:#ffffff99}
.tl .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--w);border:2px solid var(--line);color:var(--mute);position:relative;z-index:1}
.tl .t{font-size:12px;color:var(--mute);font-weight:600}
.tl .h{font-size:14px;font-weight:700;line-height:1.3}
.tl li.done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.tl li.on .n{background:var(--w);border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px var(--teal-t)}
.tl li.on button{background:var(--w);box-shadow:var(--sh)}
.tl li.bad .n{border-color:var(--coral);color:var(--coral)}
.nav{display:flex;gap:8px;margin-top:14px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--w);font-weight:700;white-space:nowrap}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* phone */
.pc{display:grid;justify-items:center;gap:12px}
.persp{display:grid;grid-template-columns:1fr 1fr;background:var(--w);border-radius:14px;padding:4px;box-shadow:var(--sh);width:100%;max-width:360px}
.persp button{border:0;background:none;border-radius:10px;min-height:48px;padding:4px 8px;font-weight:700;font-size:13px;line-height:1.2;color:var(--mute)}
.persp button small{display:block;font-weight:500;font-size:11px}
.persp button.on{background:var(--teal);color:#fff}
.phone{width:360px;max-width:100%;height:720px;border-radius:48px;background:#e9efee;padding:10px;box-shadow:inset 0 0 0 1.5px #cdd9d6,0 30px 60px -32px rgba(18,48,43,.45);position:relative}
.screen{height:100%;border-radius:39px;background:var(--w);overflow:hidden auto;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.isl{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:90px;height:25px;border-radius:999px;background:#12302b;z-index:5}
.sbar{display:flex;justify-content:space-between;padding:12px 26px 6px 30px;font-size:13px;font-weight:700;position:sticky;top:0;background:#ffffffee;z-index:4;backdrop-filter:blur(6px)}
.app{padding:4px 16px 22px}
.ah{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.ah h2{font-size:19px}
.ah .who{font-size:12px;color:var(--mute);font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:var(--teal-t);color:var(--teal-d);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.screen.k .notif{animation:none}
.notif{display:flex;gap:10px;background:#12302b;color:#fff;border-radius:16px;padding:10px 12px;margin:0 0 14px;font-size:13px;animation:drop .5s cubic-bezier(.2,.9,.3,1.1)}
.notif.bad{background:#7a2414}
.notif .lg{width:28px;height:28px;border-radius:8px;background:var(--teal);display:grid;place-items:center;flex:none}
.notif b{display:block}
.notif small{opacity:.7}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--w)}
.card h3{font-size:15px;margin-bottom:8px}
.card.t{background:var(--teal-t);border-color:var(--mint)}
.card.bad{background:var(--coral-t);border-color:#f5c9bd}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span{font-weight:700;font-size:13px}
.fld select{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--w);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;min-width:46px;border-radius:10px;border:1px solid var(--line);background:var(--w);font-weight:700;font-size:13px;padding:0 10px}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.ck:first-of-type{border-top:0}
.ck input{width:20px;height:20px;accent-color:var(--teal);margin-top:2px;flex:none}
.ck small{display:block;color:var(--mute);font-size:12px}
.tp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp select{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--w);font-size:16px;font-weight:700;min-width:66px}
.tp>b{font-size:18px}
.ampm{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin-left:4px}
.ampm button{min-height:36px;min-width:48px;border:0;border-radius:9px;background:none;font-weight:800;font-size:13px;color:var(--mute)}
.ampm button.on{background:var(--teal);color:#fff}
.cta{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:15px}
.cta.sec{background:var(--w);color:var(--ink);border:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.sum:first-of-type{border-top:0}
.sum span{color:var(--mute)}
.sum b{text-align:right}
.drv{display:flex;gap:12px;align-items:center}
.drv .av{width:48px;height:48px;font-size:16px}
.drv b{display:block;font-size:15px}
.drv small{color:var(--mute);font-size:12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{font-size:11px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.bdg.t{background:var(--teal-t);border-color:var(--mint);color:var(--teal-d)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.week div{text-align:center;font-size:11px;color:var(--mute);border-radius:10px;padding:6px 0;background:var(--soft)}
.week div.on{background:var(--teal);color:#fff;font-weight:700}
.week div b{display:block;font-size:13px}
.map{position:relative;height:200px;border-radius:16px;overflow:hidden;background:#e7efed;margin-bottom:12px}
.map svg{width:100%;height:100%;display:block}
.eta{position:absolute;left:10px;bottom:10px;background:var(--w);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;box-shadow:var(--sh)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.mid{font-size:20px;font-weight:700;line-height:1.25}
.loc2{font-size:15px;color:var(--teal-d);font-weight:700;margin-top:4px}
.rider .card{border-width:2px}
.rbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:18px;border:0;font-size:19px;font-weight:800;margin-bottom:10px;background:var(--teal);color:#fff}
.rbtn.sec{background:var(--w);color:var(--teal-d);border:2px solid var(--teal)}
.rbtn small{display:block;font-size:13px;font-weight:600;opacity:.85}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .4s}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--mute)}
.stars{display:flex;gap:6px;color:#e7a600}
.small{font-size:12px;color:var(--mute);margin:6px 0 0}
/* behind the scenes */
.bts{background:var(--w);border-radius:22px;padding:22px;box-shadow:var(--sh);position:sticky;top:12px}
.bts .k{font-size:12px;font-weight:700;color:var(--teal-d)}
.bts h2{font-size:clamp(20px,2vw,24px);margin:4px 0 6px}
.bts .lead{color:var(--ink2);margin:0 0 16px}
.bsec{border-top:1px solid var(--line);padding:14px 0}
.bsec h4{font-size:13px;color:var(--mute);margin-bottom:8px;font-weight:700}
.bsec ul{margin:0;padding:0 0 0 18px;display:grid;gap:6px}
.bsec li::marker{color:var(--teal)}
.dec{background:var(--teal-t);border-radius:14px;padding:12px 14px;color:var(--ink)}
.dec b{color:var(--teal-d)}
.mets{display:flex;flex-wrap:wrap;gap:8px}
.met{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.met b{display:block;font-size:12px;color:var(--mute);font-weight:600}
.met.ns{border-color:var(--teal);background:var(--teal-t)}
.sys{display:grid;gap:8px}
.sys div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;font-size:13px}
.sys time{font-weight:700;color:var(--teal-d);font-variant-numeric:tabular-nums}
/* scope band */
.scope{max-width:1380px;margin:0 auto;padding:6px max(4vw,16px) 40px}
.scope h2{font-size:clamp(22px,2.6vw,28px);margin-bottom:4px}
.scope>p{color:var(--mute);margin:0 0 16px;max-width:80ch}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sc{background:var(--w);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.sc h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sc h3 i{width:10px;height:10px;border-radius:50%}
.sc ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.sc li{font-size:14px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.sc li:first-child{border-top:0;padding-top:0}
.sc li b{display:block;color:var(--ink)}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.mrow div{background:#12302b;color:#fff;border-radius:18px;padding:16px 18px}
.mrow span{font-size:12px;color:#a9c9c2;font-weight:700}
.mrow b{display:block;font-size:20px;margin:2px 0}
.mrow p{margin:0;font-size:13px;color:#cfe3de}
.foot{max-width:1380px;margin:0 auto;padding:0 max(4vw,16px) 30px;color:var(--mute);font-size:13px}
.glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.gl{background:var(--w);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.gl span{font-size:12px;font-weight:700;color:var(--teal-d)}
.gl p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.gl.me{background:#12302b;color:#fff}
.gl.me span{color:#9fd3c7}
.gl.me p{color:#e3efec}
.snav{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.snav a{font-size:13px;font-weight:700;color:var(--teal-d);background:var(--w);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap}
.snav a:hover{border-color:var(--teal)}
.howto{max-width:1380px;margin:0 auto;padding:10px max(4vw,16px) 0}
.howto p{margin:0;background:var(--teal-t);border:1px solid var(--mint);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--ink2)}
.howto h2{font-size:clamp(20px,2.4vw,26px);margin:14px 0 8px}
.think{max-width:1380px;margin:0 auto;padding:8px max(4vw,16px) 36px}
.think>h2{font-size:clamp(22px,2.6vw,28px);margin:20px 0 4px}
.think>p.sub{color:var(--mute);margin:0 0 16px;max-width:80ch}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.box{background:var(--w);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.box h3{font-size:16px;margin-bottom:10px}
.ev{display:grid;gap:12px}
.ev div{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:12px;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.ev div:first-child{border-top:0;padding-top:0}
.ev b{font-size:20px;font-weight:800;color:var(--teal-d);white-space:nowrap}
.ev span{font-size:14px;color:var(--ink2)}
.ev small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.pp{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pp li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14px;color:var(--ink2);padding:8px 10px;border-radius:12px}
.pp li.top{background:var(--teal-t)}
.pp li b{color:var(--ink)}
.prio{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;align-self:start;background:var(--soft);color:var(--mute)}
.pp li.top .prio{background:var(--teal);color:#fff}
.user .role{font-size:12px;font-weight:700;color:var(--mute)}
.user.pr{outline:2px solid var(--teal)}
.user.pr .role{color:var(--teal-d)}
.user h3{margin:4px 0 6px}
.user p{margin:0 0 8px;font-size:14px;color:var(--ink2)}
.user q{display:block;font-size:14px;color:var(--ink);background:var(--soft);border-radius:10px;padding:8px 10px;quotes:none}
.why{margin-top:14px;background:#12302b;color:#e3efec;border-radius:16px;padding:14px 16px;font-size:14px}
.why b{color:#fff}
.rice{width:100%;border-collapse:collapse;font-size:14px}
.rice th{font-size:12px;color:var(--mute);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rice th:first-child,.rice td:first-child{text-align:left}
.rice td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rice td:first-child{white-space:normal;font-weight:600}
.rice tr.v1 td:last-child{color:var(--teal-d);font-weight:800}
.rice .ph{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.rice .ph.a{background:var(--teal-t);color:var(--teal-d)}
.rice .ph.b{background:var(--amber-t);color:var(--amber)}
.tw{overflow-x:auto}
.rnote{margin:12px 0 0;font-size:13px;color:var(--mute)}
.risk{display:grid;gap:10px}
.risk div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.risk div:first-child{border-top:0;padding-top:0}
.risk b{display:block}
.risk span{color:var(--mute)}
.risk span b{color:var(--ink)}
.risk em::before{content:"How I'd handle it: ";font-weight:700;color:var(--teal-d)}
.risk em{font-style:normal;color:var(--ink2)}
@media(max-width:900px){.glance{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:minmax(0,1fr)}.risk div{grid-template-columns:minmax(0,1fr);gap:2px}}
@media(max-width:520px){.glance{grid-template-columns:minmax(0,1fr)}.rice{font-size:13px}.rice th,.rice td{padding:7px 6px}}
@media(max-width:1180px){.stage{grid-template-columns:380px minmax(0,1fr)}.tlw{grid-column:1/-1;position:static}.tl{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.tl::before{display:none}.tl li{flex:none}.tl li button{grid-template-columns:28px auto;min-width:170px;background:#ffffffaa}.tl .n{width:28px;height:28px}.nav{max-width:420px}}
@media(max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}.bts{position:static}.sg,.mrow{grid-template-columns:minmax(0,1fr)}}
@media(max-width:400px){.phone{height:680px;padding:7px;border-radius:44px}.screen{border-radius:37px}.isl{top:15px}}
@media(prefers-reduced-motion:reduce){.notif{animation:none}.prog i{transition:none}}
.alinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alink{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 14px;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.alink:hover{background:var(--teal-d)}
.howto>p a{color:var(--teal-d);font-weight:700}

/* ---------- standalone app shell ---------- */
.dbar{position:sticky;top:0;z-index:20;background:#ffffffe8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.dbi{max-width:1380px;margin:0 auto;padding:8px max(3vw,12px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.dlogo{display:flex;align-items:center;gap:10px}
.dlogo .logo{width:36px;height:36px}
.dlogo b{display:block;font-weight:800;font-size:15px}
.dlogo span{display:block;color:var(--mute);font-size:12px}
.dctl{display:flex;gap:6px;align-items:center;flex:1;max-width:560px}
.dctl .btn{min-height:40px;padding:0 12px}
.dctl .btn.pri{flex:none}
.dctl select{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--w);font:600 14px Manrope,system-ui,sans-serif;color:var(--ink)}
.olink{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 14px;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.olink:hover{background:var(--teal-d)}
.solo{display:grid;justify-items:center;padding:22px 12px 28px}
.hint{max-width:560px;margin:16px auto 0;text-align:center;color:var(--mute);font-size:13px}
@media(max-width:520px){
  body{background:var(--w)}
  .dbi{padding:6px 8px}.dlogo,.olink{display:none}
  .dctl{max-width:none}.dctl .btn{padding:0 10px}
  .solo{padding:0}.hint{display:none}
  .phone{width:100%;height:calc(100dvh - 53px);border-radius:0;padding:0;box-shadow:none;background:var(--w)}
  .screen{border-radius:0}.isl{display:none}
}
</style>
</head>
<body>
<header class="dbar"><div class="dbi">
  <div class="dlogo"><div class="logo"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M8.5 11h2l1-2 1.5 4 1-2h1.5"/></svg></div><div><b>CareRide for families</b><span>Neha's phone · caregiver, Gurgaon · demo</span></div></div>
  <div class="dctl" role="group" aria-label="Demo moment">
    <button class="btn" data-a="prev" id="prev" aria-label="Previous moment">‹ Back</button>
    <select id="stepSel" aria-label="Moment in the week"></select>
    <button class="btn pri" data-a="next" id="next" aria-label="Next moment">Next ›</button>
  </div>
  <a class="olink" href="../rider/" target="_blank" rel="noopener">Open the rider app <span aria-hidden="true">↗</span></a>
</div></header>
<main class="solo">
  <div class="phone"><div class="isl"></div><div class="screen" id="screen"></div></div>
  <p class="hint">Open the rider app in another tab or window of this browser and both stay in sync. Set up the rides here, then step through the week with Next.</p>
</main>
<script>
{
const VIEW='care';
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',car:'<path d="M5 16h14M6 16l1.5-5h9L18 16M7 16v2M17 16v2"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>',pin:'<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',star:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8 6.8 19.5l1-5.8L3.6 9.6l5.8-.8z" fill="currentColor"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'};
const ic=(n,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const fmt=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return `${h%12||12}:${mm} ${h<12?'AM':'PM'}`};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const LANG={mr:{name:'Marathi',driver:'तुमचा ड्रायव्हर',tomorrow:'उद्या सकाळी',arrived:'गाडी आली आहे',reached:'तुम्ही हॉस्पिटलला पोहोचलात',onway:'प्रवास सुरू आहे',callR:'नेहाला फोन करा',callD:'ड्रायव्हरला फोन करा'},
  hi:{name:'Hindi',driver:'आपका ड्राइवर',tomorrow:'कल सुबह',arrived:'गाड़ी आ गई है',reached:'आप अस्पताल पहुँच गए हैं',onway:'आप रास्ते में हैं',callR:'नेहा को कॉल करें',callD:'ड्राइवर को कॉल करें'},
  en:{name:'English',driver:'',tomorrow:'',arrived:'',reached:'',onway:'',callR:'',callD:''}};
const D1={name:'Santosh P.',ini:'SP',car:'White Swift Dzire · MH 12 AB 4412',rating:'4.9',rides:'1,240'};
const D2={name:'Ganesh K.',ini:'GK',car:'Silver Toyota Etios · MH 12 CK 2087',rating:'4.8',rides:'860'};
const HOSP='City Kidney Care, Deccan',HOME='Home, Kothrud';
const S={step:0,view:VIEW,plan:{days:['Mon','Wed','Fri'],time:360,weeks:12,assist:true,wheel:false,wait:false,dur:270,lang:'mr'},set:false,bk:0,trip:0,keep:true,rate:0};
let bkT=null,tripT=null;
const P=()=>S.plan;
const tr=k=>LANG[P().lang][k];
const two=(en,k)=>`${en}${tr(k)?`<span class="loc2" lang="${P().lang}">${tr(k)}</span>`:''}`;

const STEPS=[
 {t:'Sunday 8:40 PM',h:'Neha sets up the week',k:'setup'},
 {t:'Sunday 8:41 PM',h:'A priority driver is matched',k:'match'},
 {t:'Sunday 9:30 PM',h:'Night-before confirmation',k:'confirm'},
 {t:'Monday',h:'Driver cancels before pickup',k:'cancel',bad:1},
 {t:'Monday',h:'Pickup and live tracking',k:'trip'},
 {t:'Monday',h:'Reached, return ride set',k:'reach'},
 {t:'Friday',h:'The week, summed up',k:'week'}];
const dayOf=m=>m<0?'Sunday':m>=1440?'Tuesday':'Monday';
const stepTime=i=>{const t=P().time;return [null,null,null,`${dayOf(t-28)} ${fmt(t-28)}`,`${dayOf(t)} ${fmt(t)}`,`${dayOf(t+17)} ${fmt(t+17)}`,'Friday 11:20 AM'][i]};
const tpH=()=>{const h=Math.floor(P().time/60)%12;return h||12};
const tpA=()=>P().time>=720?'PM':'AM';
function setTime(h,m,a){P().time=(h%12+(a==='PM'?12:0))*60+m}
/* ride home: dur = minutes from drop-off until she's ready to leave */
const DROP=17,back=()=>P().time+DROP+P().dur;
const dh=m=>`${Math.floor(m/60)} h${m%60?` ${m%60} min`:''}`;
const nd=m=>m>=1440?' (next day)':'';
const rpH=()=>{const h=Math.floor((back()%1440)/60)%12;return h||12};
const rpA=()=>back()%1440>=720?'PM':'AM';
function setBack(h,m,a){const want=(h%12+(a==='PM'?12:0))*60+m,drop=(P().time+DROP)%1440;P().dur=((want-drop)%1440+1440)%1440}
function retHTML(){const p=P(),b=back();
  if(p.wait)return `<div class="fld" style="margin:4px 0 12px"><span>How long should the driver wait?</span><select id="wdur" aria-label="Waiting time">${Array.from({length:21},(_,n)=>60+n*15).map(m=>`<option value="${m}" ${p.dur===m?'selected':''}>${dh(m)}</option>`).join('')}${p.dur%15||p.dur<60||p.dur>360?`<option value="${p.dur}" selected>${dh(p.dur)}</option>`:''}</select><span class="small" style="margin:0;font-weight:400">Drops her at the hospital at ${fmt(p.time+DROP)}, waits ${dh(p.dur)} and leaves with her at ${fmt(b)}${nd(b)}</span></div>`;
  return `<div class="fld" style="margin:4px 0 12px"><span>When will she be ready to leave?</span><div class="tp"><select id="rph" aria-label="Return hour">${Array.from({length:12},(_,n)=>n+1).map(h=>`<option value="${h}" ${rpH()===h?'selected':''}>${h}</option>`).join('')}</select><b>:</b><select id="rpm" aria-label="Return minutes">${[...new Set([...Array.from({length:12},(_,n)=>n*5),b%60])].sort((x,y)=>x-y).map(m=>`<option value="${m}" ${b%60===m?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('')}</select><div class="ampm" role="group" aria-label="AM or PM">${['AM','PM'].map(a=>`<button data-a="rampm" data-v="${a}" class="${rpA()===a?'on':''}" aria-pressed="${rpA()===a}">${a}</button>`).join('')}</div></div><span class="small" style="margin:0;font-weight:400">Drop-off at ${fmt(p.time+DROP)}. A car picks her up from the hospital at ${fmt(b)}${nd(b)}, ${dh(p.dur)} later</span></div>`}

function notif(txt,sub,bad){return `<div class="notif ${bad?'bad':''}"><div class="lg">${ic(bad?'alert':'bell',16)}</div><div><b>${txt}</b><small>${sub}</small></div></div>`}
function weekHTML(){return `<div class="week">${DAYS.map(d=>`<div class="${P().days.includes(d)?'on':''}">${d.slice(0,1)}<b>${d.slice(0,2)}</b></div>`).join('')}</div>`}
function needs(){const n=[];if(P().assist)n.push('Help getting in and out');if(P().wheel)n.push('Wheelchair in the boot');if(P().wait)n.push(`Driver waits ${dh(P().dur)} and brings her home`);n.push(`Speaks ${LANG[P().lang].name}`);return n}
function drvCard(d,extra=''){return `<div class="drv"><div class="av">${d.ini}</div><div><b>${d.name}</b><small>${d.car}</small></div></div><div class="badges"><span class="bdg t">Priority CareRide driver</span><span class="bdg">${ic('star',11)} ${d.rating} · ${d.rides} rides</span><span class="bdg">Assist-trained</span><span class="bdg">Speaks ${LANG[P().lang].name}</span>${extra}</div>`}
function mapSVG(p){
  const pts=[[30,160],[90,150],[120,110],[190,100],[230,60],[300,46]];
  const seg=pts.slice(1).map((q,i)=>Math.hypot(q[0]-pts[i][0],q[1]-pts[i][1])),tot=seg.reduce((a,b)=>a+b,0);
  let d=p*tot,x=pts[0][0],y=pts[0][1];
  for(let i=0;i<seg.length;i++){if(d<=seg[i]){const f=d/seg[i];x=pts[i][0]+(pts[i+1][0]-pts[i][0])*f;y=pts[i][1]+(pts[i+1][1]-pts[i][1])*f;break}d-=seg[i];x=pts[i+1][0];y=pts[i+1][1]}
  const path='M'+pts.map(q=>q.join(' ')).join(' L');
  return `<svg viewBox="0 0 330 200" preserveAspectRatio="xMidYMid slice" aria-label="Route map from home to hospital">
  <rect width="330" height="200" fill="#e7efed"/>
  <g stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"><path d="M0 120 L330 80"/><path d="M60 0 L110 200"/><path d="M200 0 L250 200"/><path d="M0 40 L330 30"/></g>
  <g fill="#d5e3df"><rect x="140" y="130" width="50" height="40" rx="6"/><rect x="20" y="40" width="40" height="50" rx="6"/><rect x="260" y="110" width="50" height="60" rx="6"/></g>
  <path d="${path}" fill="none" stroke="#0d7a68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
  <path d="${path}" fill="none" stroke="#0d7a68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${(p*tot).toFixed(1)} 999"/>
  <circle cx="30" cy="160" r="7" fill="#fff" stroke="#0d7a68" stroke-width="3"/>
  <g transform="translate(300 46)"><circle r="11" fill="#0d7a68"/><path d="M-4 0h8M0-4v8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
  <g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="13" fill="#12302b" opacity=".15"/><circle r="8" fill="#12302b"/><circle r="3" fill="#fff"/></g>
  </svg>`}

/* ---------- Neha's phone ---------- */
function care(){
  const p=P(),t=p.time,rpw=p.days.length*2,dr=S.step>=3?D2:D1,k=STEPS[S.step].k;
  const head=`<div class="ah"><div><div class="who">Booking for Aai (Sunanda)</div><h2>${{setup:'Set up rides',match:'Rides scheduled',confirm:'Tomorrow',cancel:'Monday ride',trip:'On the way',reach:'Reached',week:'This week'}[k]}</h2></div><div class="av">N</div></div>`;
  if(k==='setup')return head+`<div class="card"><h3>Trips</h3><div class="sum"><span>From</span><b>${HOME}</b></div><div class="sum"><span>To</span><b>${HOSP}</b></div></div>
   <div class="fld"><span>Which days?</span><div class="chips">${DAYS.map(d=>`<button data-a="day" data-v="${d}" class="${p.days.includes(d)?'on':''}" aria-pressed="${p.days.includes(d)}">${d}</button>`).join('')}</div></div>
   <div class="fld"><span>Pickup time</span><div class="tp"><select id="tph" aria-label="Hour">${Array.from({length:12},(_,n)=>n+1).map(h=>`<option value="${h}" ${tpH()===h?'selected':''}>${h}</option>`).join('')}</select><b>:</b><select id="tpm" aria-label="Minutes">${Array.from({length:12},(_,n)=>n*5).map(m=>`<option value="${m}" ${p.time%60===m?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('')}</select><div class="ampm" role="group" aria-label="AM or PM">${['AM','PM'].map(a=>`<button data-a="ampm" data-v="${a}" class="${tpA()===a?'on':''}" aria-pressed="${tpA()===a}">${a}</button>`).join('')}</div></div><span class="small" style="margin:0">Pickup at ${fmt(t)}${t<300||t>=1320?' · late-night pickups have fewer drivers, so the backup guarantee may take longer':''}</span></div>
   <div class="fld"><span>For how long?</span><div class="chips">${[4,12,24].map(w=>`<button data-a="weeks" data-v="${w}" class="${p.weeks===w?'on':''}">${w} weeks</button>`).join('')}</div></div>
   <div class="card"><h3>Aai's needs</h3>
    <label class="ck"><input type="checkbox" data-c="assist" ${p.assist?'checked':''}><span>Help getting in and out<small>Driver comes to the door and helps her to the car</small></span></label>
    <label class="ck"><input type="checkbox" data-c="wheel" ${p.wheel?'checked':''}><span>Folding wheelchair<small>Matched only with cars that fit it</small></span></label>
    <label class="ck"><input type="checkbox" data-c="wait" ${p.wait?'checked':''}><span>Driver waits and brings her back<small>Otherwise a separate ride home is booked for when she's ready</small></span></label>
    ${retHTML()}
    <div class="fld" style="margin:10px 0 0"><span>Language on Aai's phone</span><select id="lang">${Object.entries(LANG).map(([k2,l])=>`<option value="${k2}" ${p.lang===k2?'selected':''}>${l.name}</option>`).join('')}</select></div></div>
   <div class="card t"><div class="sum"><span>Every week</span><b>${p.days.length} days · ${rpw} rides</b></div><div class="sum"><span>Total</span><b>${p.days.length*p.weeks*2} rides over ${p.weeks} weeks</b></div><div class="sum"><span>Pickup</span><b>${fmt(t)}</b></div><div class="sum"><span>Ride home</span><b>${fmt(back())}${nd(back())}${p.wait?' · driver waits':''}</b></div></div>
   <button class="cta" data-a="next" ${p.days.length?'':'disabled'}>Schedule ${p.days.length*p.weeks*2} rides</button>
   <p class="small">One setup instead of ${p.days.length*p.weeks*2} separate bookings.</p>`;
  if(k==='match')return head+notif('Rides scheduled for Aai',`${p.days.join(', ')} at ${fmt(t)} · ${p.weeks} weeks`)+`<div class="card"><h3>Her regular driver</h3>${drvCard(D1)}</div><div class="card"><h3>This week</h3>${weekHTML()}<p class="small">Same driver every time where possible, so Aai sees a familiar face.</p></div>
   <div class="card"><h3>Matched for her needs</h3>${needs().map(n=>`<div class="sum"><span>${ic('check',13)} ${n}</span></div>`).join('')}</div>`;
  if(k==='confirm')return head+notif(`${D1.name} confirmed tomorrow's ride`,`Pickup ${fmt(t)} · ${HOME}`)+`<div class="card t"><div class="big">${fmt(t)}</div><p class="small">Monday pickup · confirmed by the driver at 9:30 PM</p></div><div class="card">${drvCard(D1)}</div><div class="card"><h3>Aai has been told</h3><p class="small" style="margin:0">A reminder in ${LANG[p.lang].name} is on her phone, with the driver's name and car number.</p></div>`;
  if(k==='cancel'){const done=S.bk>=100,mins=Math.round(S.bk/100*6);
   return head+notif(done?`Backup driver assigned in 6 min`:`${D1.name} can't make it`,done?`${D2.name} arrives ${fmt(t-2)} · no action needed`:`Vehicle breakdown at ${fmt(t-28)} · finding a backup`,!done)+
   `<div class="card ${done?'t':'bad'}"><h3>${done?'Ride still on time':'Finding a backup driver'}</h3><div class="prog"><i style="width:${S.bk}%"></i></div><p class="small" style="margin:0">${done?`Assigned at ${fmt(t-22)}, well within the 10-minute guarantee.`:`${mins} of 10 minutes · searching priority drivers near Kothrud`}</p></div>
   ${done?`<div class="card"><h3>New driver</h3>${drvCard(D2,'<span class="bdg t">Backup</span>')}</div><p class="small">You didn't have to do anything. Aai's phone shows the new driver too.</p>`:''}
   <button class="cta sec" data-a="replay">Replay the cancellation</button>`}
  if(k==='trip')return head+notif('Aai is in the car',`Picked up at ${fmt(t-1)} by ${D2.name}`)+`<div class="map">${mapSVG(S.trip/100)}<span class="eta">${S.trip>=100?'Arriving':`${Math.max(1,Math.round(17*(1-S.trip/100)))} min to ${HOSP.split(',')[0]}`}</span></div>
   <div class="card">${drvCard(D2)}</div><div class="row2"><button class="cta sec" data-a="call">${ic('phone',16)} Call Aai</button><button class="cta sec" data-a="call">${ic('phone',16)} Call driver</button></div>`;
  if(k==='reach')return head+notif('Aai reached City Kidney Care',`At ${fmt(t+17)} · her session starts at ${fmt(t+30)}`)+`<div class="card t"><h3>${ic('check',15)} Dropped at the entrance</h3><p class="small" style="margin:0">${p.assist?`${D2.name} walked her to the dialysis reception.`:'Dropped at the main entrance.'}</p></div>
   <div class="card"><h3>Ride home</h3><div class="sum"><span>Pickup</span><b>${fmt(back())}${nd(back())}</b></div><div class="sum"><span>Driver</span><b>${p.wait?`${D2.name} waits ${dh(p.dur)} (waiting time included)`:`${D1.name} (back on duty)`}</b></div><div class="sum"><span>To</span><b>${HOME}</b></div></div><p class="small">${p.wait?'The driver waits nearby for the time you chose, so nobody books anything on the day.':'The ride home was booked at setup for the time you chose, so nobody books it on the day.'}</p>`;
  if(k==='week'){const r=p.days.length*2;
   return head+notif('Weekly ride summary',`${r} of ${r} rides completed on time`)+`<div class="stat"><div><b>${r}/${r}</b><span>completed</span></div><div><b>2 min</b><span>avg early</span></div><div><b>1</b><span>backup used</span></div></div>
   <div class="card"><h3>Rate this week's drivers</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button data-a="rate" data-v="${n}" aria-label="${n} stars" style="border:0;background:none;padding:2px;color:${n<=S.rate?'#e7a600':'#cfd8d6'}">${ic('star',26)}</button>`).join('')}</div></div>
   <label class="card ck" style="border:1px solid var(--line)"><input type="checkbox" data-c="keep" ${S.keep?'checked':''}><span><b>Keep the same schedule next week</b><small>${p.days.join(', ')} at ${fmt(t)} with ${D1.name}</small></span></label>
   <p class="small">${p.weeks-1} weeks left in this schedule. Changes take one tap.</p>`}
}
/* ---------- Sunanda's phone (simple mode) ---------- */
function rider(){
  const p=P(),t=p.time,k=STEPS[S.step].k;
  const top=`<div class="ah"><div><div class="who">Hello, Sunanda</div><h2>CareRide</h2></div><div class="av">S</div></div>`;
  const calls=`<button class="rbtn" data-a="call">${ic('phone',22)}<span>Call Neha${tr('callR')?`<small lang="${p.lang}">${tr('callR')}</small>`:''}</span></button><button class="rbtn sec" data-a="call">${ic('phone',22)}<span>Call driver${tr('callD')?`<small lang="${p.lang}">${tr('callD')}</small>`:''}</span></button>`;
  if(k==='setup')return top+`<div class="card"><p class="mid">No rides yet.</p><p class="small" style="font-size:15px">Neha is setting up your rides. You don't need to do anything.</p></div>`;
  if(k==='match'||k==='confirm')return top+(k==='confirm'?notif('Reminder for tomorrow',`Car at ${fmt(t)}`):'')+`<div class="card"><p class="small" style="font-size:15px;margin:0">Next ride</p><div class="big">${k==='confirm'?'Tomorrow':'Monday'}, ${fmt(t)}</div>${k==='confirm'&&tr('tomorrow')?`<span class="loc2" lang="${p.lang}">${tr('tomorrow')} ${fmt(t).replace(' AM','')}</span>`:''}<p class="mid" style="margin-top:10px">To ${HOSP.split(',')[0]}</p></div>
   <div class="card"><p class="small" style="font-size:15px;margin:0">${two('Your driver','driver')}</p><p class="mid" style="margin:6px 0 2px">${D1.name}</p><p style="margin:0;font-size:16px">${D1.car}</p></div>${calls}`;
  if(k==='cancel')return top+`<div class="card ${S.bk>=100?'t':''}"><p class="small" style="font-size:15px;margin:0">${S.bk>=100?'Your driver has changed':'Checking your ride…'}</p>${S.bk>=100?`<p class="mid" style="margin:6px 0 2px">${D2.name}</p><p style="margin:0;font-size:16px">${D2.car}</p><p class="mid" style="margin-top:10px">Still ${fmt(t)}. Nothing to do.</p>`:'<p class="mid" style="margin-top:6px">Your ride is still on time.</p>'}</div>${calls}`;
  if(k==='trip')return top+`<div class="card t"><div class="big">${S.trip>=100?'Almost there':'On the way'}</div><p class="mid" style="margin-top:6px">To ${HOSP.split(',')[0]}</p><div class="prog"><i style="width:${S.trip}%"></i></div><p style="margin:0;font-size:16px">${S.trip>=100?'Arriving now':`About ${Math.max(1,Math.round(17*(1-S.trip/100)))} minutes`}</p></div>${tr('onway')?`<p class="loc2" lang="${p.lang}" style="font-size:17px">${tr('onway')} · ${D2.name}</p>`:''}${calls}`;
  if(k==='reach')return top+`<div class="card t"><div class="big">You have reached</div>${tr('reached')?`<span class="loc2" lang="${p.lang}" style="font-size:17px">${tr('reached')}</span>`:''}<p class="mid" style="margin-top:8px">Neha has been told.</p></div><div class="card"><p class="small" style="font-size:15px;margin:0">Ride home</p><div class="big">${fmt(back())}</div><p class="mid" style="margin-top:4px">${p.wait?D2.name+' will wait for you':'A car will be here'}</p></div>${calls}`;
  if(k==='week')return top+`<div class="card"><p class="small" style="font-size:15px;margin:0">Next ride</p><div class="big">Monday, ${fmt(t)}</div><p class="mid" style="margin-top:6px">${D1.name}</p></div><div class="card t"><p class="mid" style="margin:0">All ${p.days.length*2} rides this week were on time.</p></div>${calls}`;
}
/* ---------- behind the scenes ---------- */
function bts(){if(!$('#bts'))return;
  const p=P(),t=p.time,k=STEPS[S.step].k,r=p.days.length*2;
  const B={
   setup:{h:'One setup replaces dozens of bookings',lead:`Neha books ${p.days.length*p.weeks*2} rides in about a minute, from another city.`,
     sys:[['Now','Schedule saved: '+p.days.join('/')+' at '+fmt(t)+` for ${p.weeks} weeks`],['Now',`Needs saved: ${needs().join(', ')}`],['Weekly','Rides released to drivers 7 days ahead']],
     dec:'<b>Recurring scheduling is in v1</b> because chronic-care trips repeat for months. Without it, CareRide is just a normal ride app with a healthcare label.',
     mets:[['Setup completion rate','Input metric'],['Rides booked per setup','Input metric']]},
   match:{h:'Matching on needs, not just distance',lead:'A priority driver is matched for the whole week, filtered by what Sunanda needs.',
     sys:[['8:41 PM',`Filter: priority drivers near Kothrud${p.wheel?', car fits a wheelchair':''}${p.assist?', assist-trained':''}, speaks ${LANG[p.lang].name}`],['8:41 PM',`${D1.name} accepts all ${r} rides; one familiar driver where possible`],['8:41 PM','Backup pool kept warm for each pickup slot']],
     dec:'<b>Priority drivers opt in</b> to a zero-cancellation commitment in exchange for a reliability bonus. Reliability is the #1 pain point; nothing else matters if the car doesn\'t come.',
     mets:[['Driver opt-in rate','Supply metric'],['Share of rides with the same driver','Trust metric']]},
   confirm:{h:'Removing the last-minute anxiety',lead:'The driver confirms the night before, and both phones show it.',
     sys:[['9:30 PM',`${D1.name} taps "Confirm tomorrow"`],['9:30 PM','Neha notified; Sunanda gets a reminder in '+LANG[p.lang].name],['10:00 PM','No confirmation by 10 PM would trigger a backup now, not at dawn']],
     dec:'<b>Confirm early, fail early.</b> If a driver drops out, it\'s better to find out at 10 PM than at 5:45 AM when options are thin.',
     mets:[['Night-before confirmation rate','Leading indicator']]},
   cancel:{h:'A cancellation the family never has to handle',lead:'The test of the whole product: the driver drops out 28 minutes before pickup.',
     sys:[[fmt(t-28),`${D1.name} reports a vehicle breakdown`],[fmt(t-28),'Backup search: priority drivers within 4 km, same needs filter'],[fmt(t-22),`${D2.name} accepts; 6 minutes, inside the 10-minute guarantee`],[fmt(t-22),'Both phones updated; Neha is told nothing needs doing']],
     dec:'<b>The 10-minute backup guarantee is the core promise.</b> CareRide absorbs the cost of the cancellation, not the family. This is what makes ride-hailing trustworthy for dialysis.',
     mets:[['Backups assigned within 10 min','Reliability metric'],['Scheduled-ride completion','North star',1]]},
   trip:{h:'Visibility without phone calls',lead:'Neha watches from Gurgaon. Sunanda sees two big buttons, nothing else.',
     sys:[[fmt(t-1),`${D2.name} marks "Passenger in car"; Neha notified`],[fmt(t),'Live location shared with Neha for this trip only'],[fmt(t),'If the car stops off-route for 5+ min, Neha is alerted']],
     dec:'<b>Design for two users at once.</b> The caregiver books and worries; the rider just needs to know the car is here and how to reach someone.',
     mets:[['On-time pickup rate','Reliability metric'],['Caregiver calls per trip (lower is better)','Experience metric']]},
   reach:{h:'The appointment is the finish line',lead:'Arrival is confirmed and the trip home is already scheduled.',
     sys:[[fmt(t+17),'Drop-off confirmed at the dialysis entrance'],[fmt(t+17),'Neha notified: "Aai reached"'],[fmt(t+17),p.wait?`${D2.name} paid waiting time for ${dh(p.dur)}; leaves with her at ${fmt(back())}`:`Return ride released to ${D1.name} for ${fmt(back())}, the time Neha chose`]],
     dec:'<b>Driver waiting time is the hardest economics problem.</b> A 4-hour wait has to be paid fairly or drivers won\'t opt in. v1 defaults to a separate return ride; waiting is opt-in.',
     mets:[['Arrived before appointment time','Outcome metric'],['Driver earnings per CareRide hour','Guardrail',0]]},
   week:{h:'Retention comes from reliability',lead:`${r} of ${r} rides on time, one silent backup. Neha keeps the schedule running.`,
     sys:[['Friday','Weekly summary sent to Neha'],['Friday','Ratings feed driver priority scores'],['Sunday',`Next week's ${r} rides released to ${D1.name}`]],
     dec:'<b>Retention is measured by rebooking, not downloads.</b> A family that keeps the schedule running is a family that trusts the product.',
     mets:[['Scheduled-ride completion','North star',1],['Caregiver rebooking rate','Retention'],['Driver satisfaction','Guardrail']]}}[k];
  $('#bts').innerHTML=`<div class="k">Step ${S.step+1} of ${STEPS.length} · ${S.step<3?STEPS[S.step].t:stepTime(S.step)}</div><h2>${B.h}</h2><p class="lead">${B.lead}</p>
  <div class="bsec"><h4>What the system does</h4><div class="sys">${B.sys.map(x=>`<div><time>${x[0]}</time><span>${esc(x[1])}</span></div>`).join('')}</div></div>
  <div class="bsec"><h4>Product decision</h4><div class="dec">${B.dec}</div></div>
  <div class="bsec" style="padding-bottom:0"><h4>What we measure here</h4><div class="mets">${B.mets.map(m=>`<div class="met ${m[2]?'ns':''}"><b>${m[1]}</b>${m[0]}</div>`).join('')}</div></div>`}

function render(keep){
  $('#prev').disabled=S.step===0;$('#next').disabled=S.step===STEPS.length-1||!P().days.length;
  $('#stepSel').innerHTML=STEPS.map((s,i)=>`<option value="${i}" ${i===S.step?'selected':''}>${i+1}. ${i<3?s.t:stepTime(i)} · ${s.h}</option>`).join('');
  renderPhone(keep)}
function renderPhone(keep){
  const sc=$('#screen'),top=keep?sc.scrollTop:0;sc.classList.toggle('k',!!keep);
  sc.innerHTML=`<div class="sbar"><span>${S.step<3?(['8:40','8:41','9:30'][S.step]):fmt([0,0,0,P().time-28,P().time,P().time+17,680][S.step]).replace(/ [AP]M/,'')}</span><span>5G</span></div><div class="app ${S.view==='rider'?'rider':''}">${S.view==='care'?care():rider()}</div>`;
  sc.scrollTop=top}
function anim(kind){
  clearInterval(bkT);clearInterval(tripT);
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(kind==='cancel'){S.bk=0;if(rm){S.bk=100;return}bkT=setInterval(()=>{S.bk=Math.min(100,S.bk+4);renderPhone(true);if(S.bk>=100){clearInterval(bkT);bts()}},90)}
  if(kind==='trip'){S.trip=0;if(rm){S.trip=70;return}tripT=setInterval(()=>{S.trip=Math.min(100,S.trip+1.2);renderPhone(true);if(S.trip>=100)clearInterval(tripT)},70)}}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));const k=STEPS[S.step].k;
  if(k==='cancel')anim('cancel');else if(k==='trip')anim('trip');else{clearInterval(bkT);clearInterval(tripT);S.bk=100;S.trip=100}
  render()}
function act(b){
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='next')return go(S.step+1);
  if(a==='prev')return go(S.step-1);
  if(a==='go')return go(+v);
  if(a==='view'){S.view=v;return render()}
  if(a==='day'){const d=P().days;P().days=d.includes(v)?d.filter(x=>x!==v):DAYS.filter(x=>d.includes(x)||x===v);return render(true)}
  if(a==='time'){P().time=+v;return render()}
  if(a==='ampm'){setTime(tpH(),P().time%60,v);return render(true)}
  if(a==='rampm'){setBack(rpH(),back()%60,v);return render(true)}
  if(a==='weeks'){P().weeks=+v;return render(true)}
  if(a==='replay')return anim('cancel');
  if(a==='call'){b.querySelector('span')?b.querySelector('span').firstChild.textContent='Calling… (demo)':b.lastChild.textContent=' Calling… (demo)';return}
  if(a==='rate'){S.rate=+v;return renderPhone(true)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){act(b);pub()}});
document.addEventListener('change',e=>{setTimeout(pub);if(e.target.id==='stepSel'){go(+e.target.value);return}if(e.target.id==='tph'||e.target.id==='tpm'){setTime(+$('#tph').value,+$('#tpm').value,tpA());return render(true)}if(e.target.id==='rph'||e.target.id==='rpm'){setBack(+$('#rph').value,+$('#rpm').value,rpA());return render(true)}if(e.target.id==='wdur'){P().dur=+e.target.value;return render(true)}const c=e.target.dataset.c;if(c){if(c==='keep')S.keep=e.target.checked;else P()[c]=e.target.checked;return render(true)}if(e.target.id==='lang'){P().lang=e.target.value;render(true)}});

/* ---------- same-browser sync between the caregiver app and the rider app ----------
   Both apps share the week's state (which moment it is, the schedule, ratings).
   Each change is written to localStorage and broadcast; the other app redraws.
   Animations (backup search, live trip) run locally in each app. */
const ID=Math.random().toString(36).slice(2),KEY='careride-demo-v1';
const bc='BroadcastChannel' in window?new BroadcastChannel('careride-demo'):null;
function snap(){return {step:S.step,plan:S.plan,keep:S.keep,rate:S.rate,set:S.set}}
function pub(){const p={st:snap(),from:ID,at:Date.now()};try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}if(bc)bc.postMessage(p)}
function adopt(st,first){const prev=S.step;Object.assign(S,st);
  if(first||st.step!==prev)go(st.step);else render(true)}
function recv(p){if(!p||p.from===ID||!p.st)return;adopt(p.st,false)}
if(bc)bc.onmessage=e=>recv(e.data);
else addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)try{recv(JSON.parse(e.newValue))}catch(x){}});
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(saved&&saved.st)adopt(saved.st,true);else{render();pub()}

}
</script>
